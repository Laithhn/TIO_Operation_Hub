<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="650" viewBox="0 0 1500 650" role="img" aria-labelledby="title desc">
<title id="title">TIO Hub release build and deployment flow</title><desc id="desc">The repository release script validates schema migration coverage, installs locked frontend dependencies, builds the frontend, runs .NET tests unless skipped, publishes the API, packages SQL/deployment/docs, and creates a checksum. Deployment includes a backup, DBA-applied schema, matching application deployment, and health validation.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#2A78D6"/></marker></defs><rect width="1500" height="650" rx="22" fill="#F5F7FA"/><text x="65" y="72" font-family="Arial" font-size="34" font-weight="700" fill="#0C1B37">Release build and controlled deployment</text>
<g font-family="Arial" fill="#14223F"><rect x="65" y="145" width="410" height="385" rx="16" fill="#E8F1FC" stroke="#2A78D6" stroke-width="3"/><text x="270" y="193" text-anchor="middle" font-size="25" font-weight="700">Repository release script</text><text x="100" y="250" font-size="20">1. Check schema covers migrations</text><text x="100" y="300" font-size="20">2. npm ci and frontend build</text><text x="100" y="350" font-size="20">3. .NET tests (unless skipped)</text><text x="100" y="400" font-size="20">4. Publish win-x64 application</text><text x="100" y="450" font-size="20">5. Package app, SQL, docs, scripts</text><text x="100" y="500" font-size="20">6. Write SHA-256 checksum</text>
<rect x="565" y="200" width="290" height="275" rx="16" fill="#FFFFFF" stroke="#C8D4E2" stroke-width="3"/><text x="710" y="255" text-anchor="middle" font-size="25" font-weight="700">Release package</text><text x="710" y="315" text-anchor="middle" font-size="20">Versioned ZIP</text><text x="710" y="355" text-anchor="middle" font-size="20">Build info and hash</text><text x="710" y="410" text-anchor="middle" font-size="18" fill="#536177">No development settings</text>
<rect x="945" y="145" width="485" height="385" rx="16" fill="#FFFFFF" stroke="#C8D4E2" stroke-width="3"/><text x="1187" y="193" text-anchor="middle" font-size="25" font-weight="700">Operator / DBA rollout</text><text x="985" y="260" font-size="20">1. Approve change and verify package</text><text x="985" y="315" font-size="20">2. Back up database and needed files</text><text x="985" y="370" font-size="20">3. DBA applies idempotent schema</text><text x="985" y="425" font-size="20">4. Deploy matching app version</text><text x="985" y="480" font-size="20">5. Health check, smoke test, rollback if needed</text></g>
<path d="M475 335 H555" stroke="#2A78D6" stroke-width="5" marker-end="url(#arrow)"/><path d="M855 335 H935" stroke="#2A78D6" stroke-width="5" marker-end="url(#arrow)"/><text x="65" y="590" font-family="Arial" font-size="18" fill="#536177">The repository provides a local release script; this diagram does not imply a hosted CI service is configured.</text></svg>
