<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
<title id="title">TIO Hub operational case workflow</title><desc id="desc">An operations user follows client context to the affected environment, records and assigns the case, reviews linked contract SLA terms, then uses the history and report for operational review.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#2A78D6"/></marker></defs>
<rect width="1600" height="560" rx="20" fill="#F5F7FA"/><text x="70" y="80" font-family="Arial" font-size="34" font-weight="700" fill="#0C1B37">A connected operational workflow</text>
<g font-family="Arial" fill="#14223F"><rect x="70" y="190" width="250" height="185" rx="14" fill="#FFFFFF" stroke="#C8D4E2" stroke-width="3"/><text x="195" y="248" text-anchor="middle" font-size="25" font-weight="700">Client context</text><text x="195" y="295" text-anchor="middle" font-size="19">Client / project</text><text x="195" y="328" text-anchor="middle" font-size="19">Ownership / contacts</text>
<rect x="390" y="190" width="250" height="185" rx="14" fill="#FFFFFF" stroke="#C8D4E2" stroke-width="3"/><text x="515" y="248" text-anchor="middle" font-size="25" font-weight="700">Environment</text><text x="515" y="295" text-anchor="middle" font-size="19">Installation / version</text><text x="515" y="328" text-anchor="middle" font-size="19">Reported condition</text>
<rect x="710" y="190" width="250" height="185" rx="14" fill="#E8F1FC" stroke="#2A78D6" stroke-width="3"/><text x="835" y="248" text-anchor="middle" font-size="25" font-weight="700">Support case</text><text x="835" y="295" text-anchor="middle" font-size="19">Impact / owner</text><text x="835" y="328" text-anchor="middle" font-size="19">Events / next action</text>
<rect x="1030" y="190" width="250" height="185" rx="14" fill="#FFFFFF" stroke="#C8D4E2" stroke-width="3"/><text x="1155" y="248" text-anchor="middle" font-size="25" font-weight="700">Contract context</text><text x="1155" y="295" text-anchor="middle" font-size="19">Linked SLA snapshot</text><text x="1155" y="328" text-anchor="middle" font-size="19">Measured obligations</text>
<rect x="1350" y="190" width="190" height="185" rx="14" fill="#FFFFFF" stroke="#C8D4E2" stroke-width="3"/><text x="1445" y="248" text-anchor="middle" font-size="24" font-weight="700">Review</text><text x="1445" y="295" text-anchor="middle" font-size="19">History / report</text><text x="1445" y="328" text-anchor="middle" font-size="17" fill="#536177">CSV or Excel</text></g>
<g stroke="#2A78D6" stroke-width="5" marker-end="url(#arrow)"><path d="M320 280 H380"/><path d="M640 280 H700"/><path d="M960 280 H1020"/><path d="M1280 280 H1340"/></g>
<text x="70" y="445" font-family="Arial" font-size="20" fill="#536177">The hub connects records entered by authorized users. It does not poll infrastructure or synchronize Jira.</text>
<text x="70" y="490" font-family="Arial" font-size="18" fill="#536177">Illustrative workflow; exact actions and access depend on configuration, role and deployed release.</text></svg>
