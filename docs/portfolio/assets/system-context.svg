<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
<title id="title">TIO Hub system context</title><desc id="desc">Users access the React application and REST API through IIS and ASP.NET Core. EF Core connects the application to SQL Server and application file storage. The browser can optionally request map tiles from a configured provider.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#2A78D6"/></marker></defs>
<rect width="1600" height="720" rx="22" fill="#F5F7FA"/><text x="80" y="82" font-family="Arial" font-size="34" font-weight="700" fill="#0C1B37">TIO Hub system context</text>
<g font-family="Arial" fill="#14223F"><rect x="80" y="240" width="260" height="160" rx="14" fill="#FFFFFF" stroke="#C8D4E2" stroke-width="3"/><text x="210" y="300" text-anchor="middle" font-size="26" font-weight="700">Operations users</text><text x="210" y="348" text-anchor="middle" font-size="20" fill="#536177">Browser over HTTPS</text>
<rect x="470" y="190" width="420" height="260" rx="16" fill="#E8F1FC" stroke="#2A78D6" stroke-width="3"/><text x="680" y="245" text-anchor="middle" font-size="28" font-weight="700">TIO Hub web application</text><text x="680" y="300" text-anchor="middle" font-size="21">React / TypeScript UI</text><text x="680" y="345" text-anchor="middle" font-size="21">ASP.NET Core REST API</text><text x="680" y="390" text-anchor="middle" font-size="19" fill="#536177">One deployed application</text>
<rect x="1040" y="150" width="300" height="150" rx="14" fill="#FFFFFF" stroke="#C8D4E2" stroke-width="3"/><text x="1190" y="210" text-anchor="middle" font-size="25" font-weight="700">SQL Server</text><text x="1190" y="254" text-anchor="middle" font-size="20" fill="#536177">EF Core 10</text>
<rect x="1040" y="380" width="300" height="150" rx="14" fill="#FFFFFF" stroke="#C8D4E2" stroke-width="3"/><text x="1190" y="440" text-anchor="middle" font-size="25" font-weight="700">App file storage</text><text x="1190" y="484" text-anchor="middle" font-size="20" fill="#536177">Attachments / exports</text>
<rect x="470" y="550" width="420" height="100" rx="14" fill="#FFFFFF" stroke="#C8D4E2" stroke-width="3" stroke-dasharray="10 8"/><text x="680" y="592" text-anchor="middle" font-size="21" font-weight="700">Optional map tile provider</text><text x="680" y="624" text-anchor="middle" font-size="17" fill="#536177">Browser request; configurable or disabled</text></g>
<path d="M340 320 H460" stroke="#2A78D6" stroke-width="5" marker-end="url(#arrow)"/><text x="400" y="300" text-anchor="middle" font-family="Arial" font-size="17" fill="#536177">HTTPS</text>
<path d="M890 265 H1030" stroke="#2A78D6" stroke-width="5" marker-end="url(#arrow)"/><text x="960" y="245" text-anchor="middle" font-family="Arial" font-size="17" fill="#536177">Queries</text>
<path d="M890 355 C960 355 965 455 1030 455" stroke="#2A78D6" stroke-width="5" fill="none" marker-end="url(#arrow)"/><text x="957" y="408" text-anchor="middle" font-family="Arial" font-size="17" fill="#536177">Files</text>
<path d="M680 450 V540" stroke="#7B8DA6" stroke-width="4" stroke-dasharray="9 8" marker-end="url(#arrow)"/><text x="700" y="512" font-family="Arial" font-size="16" fill="#536177">Optional</text>
<text x="80" y="686" font-family="Arial" font-size="16" fill="#536177">Deployment boundary shown at a high level. Confirm identity, hosting and storage details for each installation.</text></svg>
